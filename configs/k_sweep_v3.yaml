# v3.2 K-sweep: fairness-audited TargetOnly + localsigma arm
random_seed: 42
device: "cuda"
n_optuna_trials: 0

evaluation:
  protocol: v3
  alpha_levels: [0.10]
  K_sweep: [10, 15, 20, 30, 50]
  max_target_calib_fraction: 0.30
  primary_K: 20

models:
  lightgbm:
    enabled: true
    n_trials: 0
  xgboost:
    enabled: false
  catboost:
    enabled: false
  deep_mlp:
    enabled: false

methods_to_evaluate:
  - SplitCP
  - TargetOnlyCP
  - TransferCal-CP
  - TransferCal-CP-affine
  - TransferCal-CP-affine-localsigma
  - TransferCal-CP-boost

statistical_tests:
  compare_methods:
    - ["TransferCal-CP-affine", "TargetOnlyCP"]
    - ["TransferCal-CP-affine-localsigma", "TargetOnlyCP"]

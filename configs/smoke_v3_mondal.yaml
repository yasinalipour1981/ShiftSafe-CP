# Stage-4 v3 smoke: Mondal fold, K=20, single seed
random_seed: 42
device: "cuda"
data_dir: "./data"
raw_data_dir: "./data/raw"
processed_data_dir: "./data/processed"
results_dir: "./results"
config_dir: "./configs"
log_level: "INFO"
log_dir: "./results/logs"
n_optuna_trials: 0

datasets:
  D1_uci165:
    source: "ucimlrepo"
    ucimlrepo_id: 165
  D2_uci182:
    source: "ucimlrepo"
    ucimlrepo_id: 182
  D3_zviazhynski:
    source: "manual_download"
    file: "zviazhynski_supplementary.csv"
  D4_mondal:
    source: "reconstructed"

feature_engineering:
  derive_ratios: true
  derive_interaction: true

evaluation:
  protocol: v3
  alpha_levels: [0.10]
  lodo_n_seeds: 1
  train_calib_split: 0.8
  held_out_folds: ["D4"]
  K_sweep: [20]
  max_target_calib_fraction: 0.30

models:
  lightgbm:
    enabled: true
    n_trials: 0
  xgboost:
    enabled: false
  catboost:
    enabled: false
  deep_mlp:
    enabled: false

methods_to_evaluate:
  - SplitCP
  - ShiftSafe-CP
  - TargetOnlyCP
  - TransferCal-CP
  - TransferCal-CP-boost

statistical_tests:
  compare_methods:
    - ["TransferCal-CP", "TargetOnlyCP"]

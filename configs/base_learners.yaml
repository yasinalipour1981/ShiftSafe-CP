# Base learner hyperparameter tuning
optuna:
  n_trials: 100
  n_startup_trials: 10
  timeout_sec: null

models:
  lightgbm:
    enabled: true
    device: "gpu"
    n_trials: 100
  xgboost:
    enabled: true
    tree_method: "gpu_hist"
    n_trials: 100
  catboost:
    enabled: true
    task_type: "GPU"
    n_trials: 100
  deep_mlp:
    enabled: true
    n_ensemble: 5
    hidden_dims: [256, 128, 64]
    dropout_rate: 0.1
    epochs: 200
    batch_size: 32
    lr: 0.001
    patience: 30
  tabpfn:
    enabled: false
    max_samples: 1000

primary_base_learner: "lightgbm"

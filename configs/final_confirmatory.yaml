# ShiftSafe-CP-final confirmatory grid (seeds 142-191, pre-registered)
random_seed: 142
device: "cuda"
n_optuna_trials: 0

evaluation:
  protocol: v_final
  alpha_levels: [0.05, 0.10, 0.20, 0.30]
  K_sweep: [10, 15, 20, 30, 50]
  max_target_calib_fraction: 0.30
  primary_K: 20

models:
  lightgbm:
    enabled: true
    n_trials: 0
  xgboost:
    enabled: false
  catboost:
    enabled: false
  deep_mlp:
    enabled: false

methods_to_evaluate:
  - SplitCP
  - TargetOnlyCP
  - TransferCal-CP-affine-localsigma
  - AdaptiveJackknifeCP
  - AdaptiveSplitCP

statistical_tests:
  compare_methods:
    - ["AdaptiveJackknifeCP", "TargetOnlyCP"]
    - ["AdaptiveJackknifeCP", "TransferCal-CP-affine-localsigma"]
